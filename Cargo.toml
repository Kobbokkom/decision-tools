[package]
name = "decision-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "A self-hosted MCP server for decisions and registered workflows"
repository = "https://github.com/Kobbokkom/decision-tools"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
ignore = "0.4"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.11", features = ["transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "signal", "net", "time", "sync"] }
tokio-tungstenite = "0.28"
toml = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
